# Published images (no build).
# Required in .env: ATLAS_INVENTORY=/abs/path/to/atlas-inventory
# Optional: ATLAS_CLUSTER_ROOT  ATLAS_UI_IMAGE_TAG
#
#   cp .env.example .env
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d
#
# Inside hub/worker: /atlas/clusterctl  /atlas/clusters  /atlas/workspace
# SSH for clusterctl: System / Secrets Manager. Do not set SSH_KEY.

# --- in-container mounts (fixed) ---
x-in-clusterctl: &in_clusterctl /atlas/clusterctl
x-in-clusters: &in_clusters /atlas/clusters
x-in-workspace: &in_workspace /atlas/workspace

# --- host bind sources (the only machine-specific values) ---
x-host-clusterctl: &host_clusterctl ${ATLAS_CLUSTER_ROOT:-${PWD}/atlas-clusterctl}
x-host-clusters: &host_clusters ${ATLAS_INVENTORY:?set ATLAS_INVENTORY in .env}/clusters
x-host-workspace: &host_workspace ${ATLAS_INVENTORY:?set ATLAS_INVENTORY in .env}/workspace

# --- images / git ---
x-git-url: &git_url https://github.com/yokozu777/atlas-clusterctl.git
x-image-hub: &image_hub yokozu/atlas-ui-hub:${ATLAS_UI_IMAGE_TAG:-latest}
x-image-ui: &image_ui yokozu/atlas-ui:${ATLAS_UI_IMAGE_TAG:-latest}
x-image-worker: &image_worker yokozu/atlas-ui-worker:${ATLAS_UI_IMAGE_TAG:-latest}

# --- shared fragments ---
x-bind-clusterctl: &bind_clusterctl
  type: bind
  source: *host_clusterctl
  target: *in_clusterctl
x-bind-clusters: &bind_clusters
  type: bind
  source: *host_clusters
  target: *in_clusters
x-bind-workspace: &bind_workspace
  type: bind
  source: *host_workspace
  target: *in_workspace

x-hub-volumes: &hub_volumes
  - ./data:/app/data
  - *bind_clusterctl
  - *bind_clusters
  - *bind_workspace
  - /var/run/docker.sock:/var/run/docker.sock

x-path-env: &path_env
  ATLAS_CLUSTER_ROOT: *in_clusterctl
  ATLAS_CLUSTERS_ROOT: *in_clusters
  ATLAS_WORKSPACE_ROOT: *in_workspace
  ATLAS_CLUSTER_ROOT_HOST: *host_clusterctl
  ATLAS_CLUSTERS_ROOT_HOST: *host_clusters
  ATLAS_WORKSPACE_ROOT_HOST: *host_workspace
  ATLAS_CLUSTERCTL_GIT_URL: *git_url

x-healthcheck: &hub_health
  test:
    [
      "CMD",
      "python3",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
    ]
  interval: 2s
  timeout: 2s
  retries: 20
  start_period: 5s

services:
  hub:
    image: *image_hub
    container_name: atlas-ui-hub
    ports:
      - "8000:8000"
    volumes: *hub_volumes
    environment:
      TZ: Europe/Berlin
      DATA_DIR: /app/data
      PORT: 8000
      <<: *path_env
    healthcheck: *hub_health
    restart: unless-stopped

  ui:
    image: *image_ui
    container_name: atlas-ui
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Berlin
      HUB_API_URL: http://hub:8000
      ATLAS_CLUSTERCTL_GIT_URL: *git_url
      ATLAS_CLUSTER_ROOT: *in_clusterctl
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: *image_worker
    container_name: atlas-ui-worker
    volumes: *hub_volumes
    environment:
      TZ: Europe/Berlin
      WORKER_SERVER_URL: http://hub:8000
      DATA_DIR: /app/data
      WORKER_TOKEN_FILE: /app/data/worker.token
      ATLAS_WORKER_RUNTIME: docker
      <<: *path_env
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped
