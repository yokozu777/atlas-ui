# Run atlas-ui from Docker Hub images (no local build).
#
#   cp .env.example .env   # absolute ATLAS_* paths and SSH_KEY
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d
#
# Pin a release: ATLAS_UI_IMAGE_TAG=2026-09-09 docker compose -f docker-compose.hub.yml up -d
#
# Atlas trees must be bind-mounted at the SAME host absolute path (not /opt/…).
# Do not set CLUSTER_EXECUTOR_FORCE_LOCAL on hub or worker.

services:
  hub:
    image: yokozu/atlas-ui-hub:${ATLAS_UI_IMAGE_TAG:-latest}
    container_name: atlas-ui-hub
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ${ATLAS_CLUSTER_ROOT}:${ATLAS_CLUSTER_ROOT}
      - ${ATLAS_CLUSTERS_ROOT}:${ATLAS_CLUSTERS_ROOT}
      - ${ATLAS_WORKSPACE_ROOT}:${ATLAS_WORKSPACE_ROOT}
    environment:
      - TZ=Europe/Berlin
      - DATA_DIR=/app/data
      - PORT=8000
      - ATLAS_CLUSTER_ROOT=${ATLAS_CLUSTER_ROOT}
      - ATLAS_CLUSTERS_ROOT=${ATLAS_CLUSTERS_ROOT}
      - ATLAS_WORKSPACE_ROOT=${ATLAS_WORKSPACE_ROOT}
    restart: unless-stopped

  ui:
    image: yokozu/atlas-ui:${ATLAS_UI_IMAGE_TAG:-latest}
    container_name: atlas-ui
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      - HUB_API_URL=http://hub:8000
    depends_on:
      - hub
    restart: unless-stopped

  worker:
    image: yokozu/atlas-ui-worker:${ATLAS_UI_IMAGE_TAG:-latest}
    container_name: atlas-ui-worker
    network_mode: host
    volumes:
      - ./data:/app/data
      - ${ATLAS_CLUSTER_ROOT}:${ATLAS_CLUSTER_ROOT}
      - ${ATLAS_CLUSTERS_ROOT}:${ATLAS_CLUSTERS_ROOT}
      - ${ATLAS_WORKSPACE_ROOT}:${ATLAS_WORKSPACE_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SSH_KEY}:${SSH_KEY}:ro
    environment:
      - TZ=Europe/Berlin
      - WORKER_SERVER_URL=${WORKER_SERVER_URL:-http://127.0.0.1:8000}
      - DATA_DIR=/app/data
      - WORKER_TOKEN_FILE=/app/data/worker.token
      - ATLAS_WORKER_RUNTIME=docker
      - ATLAS_CLUSTER_ROOT=${ATLAS_CLUSTER_ROOT}
      - ATLAS_CLUSTERS_ROOT=${ATLAS_CLUSTERS_ROOT}
      - ATLAS_WORKSPACE_ROOT=${ATLAS_WORKSPACE_ROOT}
      - SSH_KEY=${SSH_KEY}
    depends_on:
      - hub
    restart: unless-stopped
