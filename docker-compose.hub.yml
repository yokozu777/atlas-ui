# Run atlas-ui from Docker Hub images (no local build).
#
#   cp .env.example .env   # inventory/workspace/SSH_KEY; clusterctl defaults to ./atlas-clusterctl
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d
#
# Pin a release: ATLAS_UI_IMAGE_TAG=2026-09-09 docker compose -f docker-compose.hub.yml up -d
#
# .env holds host paths only. Inside containers they are /atlas/clusterctl,
# /atlas/clusters, /atlas/workspace, /atlas/ssh/id_rsa. Worker starts krang
# via /var/run/docker.sock (not CLUSTER_EXECUTOR_FORCE_LOCAL on hub/worker).
# Unset ATLAS_CLUSTER_ROOT → ${PWD}/atlas-clusterctl. Clone from Settings or git.

x-atlas-clusterctl-bind: &atlas-clusterctl-bind
  type: bind
  source: ${ATLAS_CLUSTER_ROOT:-${PWD}/atlas-clusterctl}
  target: /atlas/clusterctl

x-atlas-clusters-bind: &atlas-clusters-bind
  type: bind
  source: ${ATLAS_CLUSTERS_ROOT}
  target: /atlas/clusters

x-atlas-workspace-bind: &atlas-workspace-bind
  type: bind
  source: ${ATLAS_WORKSPACE_ROOT}
  target: /atlas/workspace

x-atlas-path-env: &atlas-path-env
  ATLAS_CLUSTER_ROOT: /atlas/clusterctl
  ATLAS_CLUSTERS_ROOT: /atlas/clusters
  ATLAS_WORKSPACE_ROOT: /atlas/workspace
  ATLAS_CLUSTER_ROOT_HOST: ${ATLAS_CLUSTER_ROOT:-${PWD}/atlas-clusterctl}
  ATLAS_CLUSTERS_ROOT_HOST: ${ATLAS_CLUSTERS_ROOT}
  ATLAS_WORKSPACE_ROOT_HOST: ${ATLAS_WORKSPACE_ROOT}

services:
  hub:
    image: yokozu/atlas-ui-hub:${ATLAS_UI_IMAGE_TAG:-latest}
    container_name: atlas-ui-hub
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - *atlas-clusterctl-bind
      - *atlas-clusters-bind
      - *atlas-workspace-bind
    environment:
      TZ: Europe/Berlin
      DATA_DIR: /app/data
      PORT: 8000
      ATLAS_CLUSTERCTL_GIT_URL: ${ATLAS_CLUSTERCTL_GIT_URL:-https://github.com/yokozu777/atlas-clusterctl.git}
      <<: *atlas-path-env
    restart: unless-stopped

  ui:
    image: yokozu/atlas-ui:${ATLAS_UI_IMAGE_TAG:-latest}
    container_name: atlas-ui
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Berlin
      HUB_API_URL: http://hub:8000
      ATLAS_CLUSTERCTL_GIT_URL: ${ATLAS_CLUSTERCTL_GIT_URL:-https://github.com/yokozu777/atlas-clusterctl.git}
      ATLAS_CLUSTER_ROOT: /atlas/clusterctl
    depends_on:
      - hub
    restart: unless-stopped

  worker:
    image: yokozu/atlas-ui-worker:${ATLAS_UI_IMAGE_TAG:-latest}
    container_name: atlas-ui-worker
    volumes:
      - ./data:/app/data
      - *atlas-clusterctl-bind
      - *atlas-clusters-bind
      - *atlas-workspace-bind
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${SSH_KEY}
        target: /atlas/ssh/id_rsa
        read_only: true
    environment:
      TZ: Europe/Berlin
      WORKER_SERVER_URL: ${WORKER_SERVER_URL:-http://hub:8000}
      DATA_DIR: /app/data
      WORKER_TOKEN_FILE: /app/data/worker.token
      ATLAS_WORKER_RUNTIME: docker
      ATLAS_CLUSTERCTL_GIT_URL: ${ATLAS_CLUSTERCTL_GIT_URL:-https://github.com/yokozu777/atlas-clusterctl.git}
      SSH_KEY: /atlas/ssh/id_rsa
      <<: *atlas-path-env
    depends_on:
      - hub
    restart: unless-stopped
